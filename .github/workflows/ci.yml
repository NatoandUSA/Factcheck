name: Canonical CI Verification Suite

on:
  push:
    branches: [ main, codex/audit-closeout ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies & Build Native Addons From Source
        run: npm ci --build-from-source

      - name: Verify Native SQLite Addon Loading
        run: node -e "require('./node_modules/sqlite3'); console.log('🟢 Native sqlite3 addon verified in CI');"

      - name: Run Canonical Test Suite (42/42 Test Files)
        run: npm test

      - name: Build Vite Production Bundle
        run: npm run build
