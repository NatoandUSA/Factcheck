name: Canonical CI Verification Suite

on:
  push:
    branches: [ main, codex/audit-closeout ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Canonical Test Suite (23/23 Test Files)
        run: npm test

      - name: Build Vite Production Bundle
        run: npm run build
