name: Canonical CI Verification Suite

on:
  workflow_dispatch:
  push:
    branches: [ main, codex/audit-closeout ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Migration closure tests inspect the exact pre-remediation schema commit.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies & Build Native Addons From Source
        run: npm ci --build-from-source

      - name: Verify Native SQLite Addon Loading
        run: node -e "require('./node_modules/sqlite3'); console.log('🟢 Native sqlite3 addon verified in CI');"

      - name: Audit Runtime And Development Dependencies
        run: npm audit --audit-level=moderate

      - name: Build Vite Production Bundle
        run: npm run build

      # The performance contract serves the production SPA from dist/.
      # Build it before the suite so CI tests the same artifact boundary as
      # the production runtime rather than a missing static directory.
      - name: Run Canonical Test Suite
        run: npm test
