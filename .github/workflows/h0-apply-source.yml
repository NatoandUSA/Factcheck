name: H0 Apply Source Patch

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-h0-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt2/h0-evidence-authority'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout H0 implementation branch
        uses: actions/checkout@v4
        with:
          ref: gpt2/h0-evidence-authority
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Apply deterministic H0 patch
        run: node scripts/h0_apply_patch.cjs

      - name: Verify H0 authority contract
        run: node tests/test_h0_evidence_authority_red.cjs

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit source implementation
        run: |
          if git diff --quiet -- server/server.js; then
            echo "H0 source already committed"
            exit 0
          fi
          git config user.name "GPT2 H0 Implementation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "feat(h0): enforce fail-closed evidence authority"
          git push origin HEAD:gpt2/h0-evidence-authority
