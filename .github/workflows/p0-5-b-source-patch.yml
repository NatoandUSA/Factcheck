name: P0.5-B Temporary Source Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: p0-5-b-source-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/p0.5-b-etsy-truth-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0.5-b-etsy-truth-semantics
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply base Etsy route patch if still needed
        run: |
          if grep -q "API: One-Click Auto-Pull LIVE Etsy Trends" server/server.js; then
            echo "Base Etsy truth patch already present."
          else
            node scripts/apply_p0_5_b_server_only_wrapper.cjs
          fi

      - name: Apply server-authoritative provenance patch
        run: node scripts/apply_p0_5_b_provenance_patch.cjs

      - name: Apply exact-marker Etsy workspace patch
        run: node scripts/apply_p0_5_b_workspace_patch.cjs

      - name: Remove unusable source-less seller scan action
        run: node scripts/apply_p0_5_b_scanner_cleanup.cjs

      - name: Show scoped diff
        run: git diff -- server/server.js server/competitorBatchLearner.js src/components/EtsyWorkspace.jsx src/components/EtsyMultiSellerScanner.jsx

      - name: Run canonical assertion suite
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit and rebase patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/competitorBatchLearner.js src/components/EtsyWorkspace.jsx src/components/EtsyMultiSellerScanner.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(etsy-truth): make Etsy evidence provenance and Staff UI fail closed"
          git fetch origin fix/p0.5-b-etsy-truth-semantics
          git rebase origin/fix/p0.5-b-etsy-truth-semantics
          git push origin HEAD:fix/p0.5-b-etsy-truth-semantics
