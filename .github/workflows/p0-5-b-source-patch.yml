name: P0.5-B Temporary Source Patch

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/p0.5-b-etsy-truth-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0.5-b-etsy-truth-semantics
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact-marker server route patch
        run: node scripts/apply_p0_5_b_server_only_wrapper.cjs

      - name: Apply exact-marker Etsy workspace patch
        run: node scripts/apply_p0_5_b_workspace_patch.cjs

      - name: Show scoped diff
        run: git diff -- server/server.js src/components/EtsyWorkspace.jsx

      - name: Run canonical assertion suite
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit patched source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/components/EtsyWorkspace.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix(etsy-truth): fail closed on missing seller and MCP evidence"
            git push origin HEAD:fix/p0.5-b-etsy-truth-semantics
          fi
